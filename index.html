    <main>
      <section id="hero">
        <img

          src="./assets/images and icons/seafood-pic-hero.jpg"

          <h1 id="hero-header">A Taste of the Ocean.</h1>
          <p id="hero-subheader">
            Carefully crafted seafood made with fresh ingredients and bold

          <div id="hero-btns">
